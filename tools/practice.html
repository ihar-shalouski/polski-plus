<script id="exercise-data" type="application/json">{"version":1,"scope":"Существительные единственного и множественного числа; мужская личная и немужская личная категории, pluralia tantum. Базовые модели и явно указанные словарные формы, не полная грамматика. Прилагательные в контексте даны готовыми.","sources":[{"id":"swan","title":"Oscar E. Swan · A Grammar of Contemporary Polish","url":"https://lektorek.org/lektorek/grammar.pdf","note":"Главы 3–5: склонение существительных; главы о падежах и предлогах. Сверка: 2026-09-28."},{"id":"polski-info","title":"polski.info · Существительные","url":"https://polski.info/grammar/nouns?hl=ru","note":"Сводная таблица и управление. В источнике встречаются опечатки, поэтому он не используется как автоматическая база форм."},{"id":"wsjp-dentysta","title":"WSJP PAN · dentysta","url":"https://wsjp.pl/haslo/podglad/2532/dentysta","note":"Мужской род и родительный dentysty; сочетания iść/chodzić do dentysty. Сверка: 2026-09-29."},{"id":"wsjp-rower","title":"WSJP PAN · rower (pojazd)","url":"https://wsjp.pl/haslo/podglad/2906/rower/1324092/pojazd","note":"Местный rowerze; сочетание jeździć na rowerze. Сверка: 2026-09-29."},{"id":"wsjp-ksiegowy","title":"WSJP PAN · księgowy","url":"https://wsjp.pl/haslo/podglad/22258/ksiegowy","note":"Существительное с прилагательным склонением; narzędnik księgowym. Сверка 2026-09-30."},{"id":"wsjp-usta","title":"WSJP PAN · usta","url":"https://wsjp.pl/haslo/podglad/20097/usta/2397460/otwor","note":"Pluralia tantum, немужская личная категория. Сверка 2026-09-30."},{"id":"wsjp-imie","title":"WSJP PAN · imię","url":"https://wsjp.pl/haslo/podglad/8390/imie/4996424/dla-czlowieka","note":"Особая основа imion- во множественном числе. Сверка 2026-09-30."},{"id":"wsjp-gospodyni","title":"WSJP PAN · gospodyni","url":"https://wsjp.pl/haslo/podglad/7989/gospodyni/1524349/gosposia","note":"Формы существительных на -yni, в том числе звательный gospodyni. Сверка 2026-09-30."},{"id":"nck-sedzia","title":"NCK · O sędzi, sędzim i sędzinie","url":"https://nck.pl/projekty-kulturalne/projekty/ojczysty-dodaj-do-ulubionych/ciekawostki-jezykowe/o-sedzi-sedzim-i-sedzinie-cz-i,cltt","note":"Современная модель sędzia → sędziowie. Сверка 2026-09-30."},{"id":"cambridge-anglican","title":"Cambridge Dictionary · Anglican","url":"https://dictionary.cambridge.org/dictionary/english-polish/anglican","note":"Лемма anglikanin (англиканин), отличная от Anglik (англичанин). Сверка 2026-09-30."},{"id":"zpe-gender","title":"ZPE · Пять родов существительного: m1, m2, m3, f, n","url":"https://zpe.gov.pl/a/plec-a-rodzaj-gramatyczny-wyrazow/Db6A6ZLOI","note":"Различие m1/m2/m3 и связь с формами винительного и множественного. Сверка 2026-10-01."},{"id":"wsjp-banan","title":"WSJP PAN · banan (плод): m2","url":"https://wsjp.pl/haslo/podglad/51096/banan/5151279/owoc","note":"Грамматический m2 у названия плода; не переносить на значение растения."},{"id":"wsjp-wirus","title":"WSJP PAN · wirus: m2 / m3","url":"https://wsjp.pl/haslo/podglad/33927/wirus/4213260/grypy","note":"Словарная вариативность рода и винительного."},{"id":"wsjp-koronawirus","title":"WSJP PAN · koronawirus: m2 / m3","url":"https://wsjp.pl/haslo/podglad/99350/koronawirus","note":"Допустимы оба типа; не считать один из них ошибкой."}],"cases":[{"id":"mianownik","name":"Mianownik","ru":"Именительный","question":"kto? co?","hint":"Кто или что является предметом сообщения?","prepositions":[""]},{"id":"dopelniacz","name":"Dopełniacz","ru":"Родительный","question":"kogo? czego?","hint":"Отсутствие, принадлежность, направление с do.","prepositions":["","do","bez","od","z","dla","obok","ze","znad","spod","sprzed","zza","spomiędzy","oprócz"]},{"id":"celownik","name":"Celownik","ru":"Дательный","question":"komu? czemu?","hint":"Кому адресовано действие?","prepositions":["","dzięki","ku","przeciw"]},{"id":"biernik","name":"Biernik","ru":"Винительный","question":"kogo? co?","hint":"Прямой объект или направление с na, w и другими предлогами.","prepositions":["","na","w","przez","pod","nad","za","przed","między","pomiędzy","o"]},{"id":"narzednik","name":"Narzędnik","ru":"Творительный","question":"kim? czym?","hint":"С кем, чем, каким средством?","prepositions":["","z","ze","pod","nad","przed","za","między","pomiędzy"]},{"id":"miejscownik","name":"Miejscownik","ru":"Местный","question":"o kim? o czym?","hint":"Место или тема; всегда с предлогом.","prepositions":["w","we","na","o","po","przy"]},{"id":"wolacz","name":"Wołacz","ru":"Звательный","question":"Обращение","hint":"К кому обращаются напрямую?","prepositions":[""]}],"rules":[{"id":"nom-base","cases":["mianownik"],"genders":["m1","m2","m3","f","n"],"label":"Словарная форма → без изменений","explanation":"В именительном используется исходная форма существительного. Окончание не добавляем.","example":"mapa → mapa","sources":["swan","polski-info"],"numbers":["sg"]},{"id":"gen-f-y","cases":["dopelniacz"],"genders":["f"],"label":"Женский на -a, твёрдая основа → -y","explanation":"У этой группы -a заменяется на -y. После k и g выбирают -i; мягкие основы требуют отдельного правила.","example":"mapa → mapy","sources":["swan","polski-info"],"numbers":["sg"]},{"id":"gen-f-i","cases":["dopelniacz"],"genders":["f"],"label":"Женский на -ka / -ga → -ki / -gi","explanation":"После k и g вместо -y пишется -i: уберите -a и добавьте -i.","example":"książka → książki","sources":["swan","polski-info"],"numbers":["sg"]},{"id":"gen-m-a","cases":["dopelniacz"],"genders":["m1","m2"],"label":"Мужской m1 / m2 на согласный → -a","explanation":"Для этих одушевлённых существительных добавляем -a. Изменения основы нужно учитывать отдельно.","example":"kot → kota","sources":["swan","polski-info"],"numbers":["sg"]},{"id":"gen-m-a-y","cases":["dopelniacz"],"genders":["m1"],"label":"Мужской на -a, твёрдая основа → -y","explanation":"У мужских слов типа dentysta заменяем -a на -y. Мужской род не означает склонение по модели kot → kota. Правило не охватывает основы на k/g (kolega → kolegi) и мягкие основы.","example":"dentysta → dentysty","sources":["wsjp-dentysta","swan"],"numbers":["sg"]},{"id":"gen-m-dictionary","cases":["dopelniacz"],"genders":["m3"],"label":"Мужской неодушевлённый: -a / -u — словарный выбор","explanation":"По одной последней букве выбор между -a и -u не определяется. Запоминайте родительный вместе со словом; изменение основы тоже может быть словарным.","example":"dom → domu; stół → stołu","sources":["swan","polski-info"],"numbers":["sg"]},{"id":"gen-n-a","cases":["dopelniacz"],"genders":["n"],"label":"Средний на -o / -e → -a","explanation":"У регулярных существительных среднего рода заменяем -o или -e на -a. Слова на -ę могут менять основу и сюда не входят.","example":"okno → okna","sources":["swan","polski-info"],"numbers":["sg"]},{"id":"dat-m-owi","cases":["celownik"],"genders":["m1","m2","m3"],"label":"Мужской на согласный → обычно -owi","explanation":"Для регулярной группы добавляем -owi. У ряда частых слов окончание -u; их учим отдельно.","example":"student → studentowi","sources":["swan","polski-info"],"numbers":["sg"]},{"id":"dat-m-u","cases":["celownik"],"genders":["m1","m2","m3"],"label":"Частое мужское исключение → -u","explanation":"Это словарная группа: brat → bratu, pan → panu, pies → psu, kot → kotu. Нельзя выбирать её для любого короткого слова.","example":"brat → bratu","sources":["swan","polski-info"],"numbers":["sg"]},{"id":"datloc-a-hard","cases":["celownik","miejscownik"],"genders":["f","m1"],"label":"На -a, твёрдая основа → -e со смягчением","explanation":"У слов на -a в дательном и местном единственного числа ставится окончание -e. Перед ним конечная твёрдая согласная основы меняется: m → mi, w → wi, b → bi, p → pi, t → ci, r → rz. По этому же правилу склоняются мужские имена на -a.","example":"mama → mamie; Warszawa → Warszawie","sources":["swan","polski-info"],"numbers":["sg"]},{"id":"datloc-a-kg","cases":["celownik","miejscownik"],"genders":["f","m1"],"label":"На -ka / -ga → -ce / -dze","explanation":"Перед -e в этой группе k чередуется с c, g — с dz. Род не отменяет тип склонения: kolega → koledze.","example":"książka → książce; noga → nodze","sources":["swan","polski-info"],"numbers":["sg"]},{"id":"datloc-f-soft","cases":["celownik","miejscownik"],"genders":["f"],"label":"Женская мягкая основа → -i","explanation":"Для выбранных слов с мягкой основой используется -i; написание отражает мягкость. Это правило не охватывает все слова на -ia.","example":"kuchnia → kuchni; babcia → babci","sources":["swan","polski-info"],"numbers":["sg"]},{"id":"datloc-f-c","cases":["celownik","miejscownik"],"genders":["f"],"label":"Женский на -ca → -cy","explanation":"В этой группе убираем -a и добавляем -y. c здесь не чередуется с k.","example":"ulica → ulicy","sources":["swan","polski-info"],"numbers":["sg"]},{"id":"dat-n-u","cases":["celownik"],"genders":["n"],"label":"Средний на -o / -e → -u","explanation":"В регулярном типе -o или -e заменяется на -u.","example":"okno → oknu","sources":["swan","polski-info"],"numbers":["sg"]},{"id":"acc-a-e","cases":["biernik"],"genders":["f","m1"],"label":"Существительное на -a → -ę","explanation":"Для регулярного типа на -a выбираем -ę, в том числе у мужских слов вроде kolega. Исключения, например pani → panią, изучаются отдельно.","example":"książka → książkę","sources":["swan","polski-info"],"numbers":["sg"]},{"id":"acc-m-inanimate","cases":["biernik"],"genders":["m3"],"label":"Мужской неодушевлённый m3 → как именительный","explanation":"У m3 винительный единственного совпадает с именительным: widzę stół. Тип определяется польской грамматикой, а не только значением: некоторые названия предметов относятся к m2. Родительный m3 (-a или -u) по-прежнему выбирается словарно.","example":"stół → stół","sources":["swan","polski-info","zpe-gender"],"numbers":["sg"]},{"id":"acc-m-animate","cases":["biernik"],"genders":["m1","m2"],"label":"Мужской m1 / m2 на согласный → как родительный","explanation":"У мужских личных (m1: student) и одушевлённых неличных (m2: kot) на согласный винительный единственного совпадает с родительным: studenta, kota. Изменения основы запоминаем отдельно. Мужские на -a идут по другой модели: kolega → kolegę. Грамматический m2 бывает и у названий предметов, например banan → banana.","example":"kot → kota","sources":["swan","polski-info","zpe-gender","wsjp-banan"],"numbers":["sg"]},{"id":"acc-n-base","cases":["biernik"],"genders":["n"],"label":"Средний род → как именительный","explanation":"Винительный среднего рода совпадает с именительным.","example":"okno → okno","sources":["swan","polski-info"],"numbers":["sg"]},{"id":"acc-f-consonant","cases":["biernik"],"genders":["f"],"label":"Женский на согласный → как именительный","explanation":"У женских существительных на согласный винительный совпадает со словарной формой.","example":"noc → noc","sources":["swan","polski-info"],"numbers":["sg"]},{"id":"ins-a-a","cases":["narzednik"],"genders":["f","m1"],"label":"Существительное на -a → -ą","explanation":"У регулярных существительных на -a заменяем окончание на -ą. Мужской род слова kolega этому не мешает.","example":"mapa → mapą; kolega → kolegą","sources":["swan","polski-info"],"numbers":["sg"]},{"id":"ins-mn-em","cases":["narzednik"],"genders":["m1","m2","m3","n"],"label":"Мужской / средний, обычная основа → -em","explanation":"К основе добавляем -em; у среднего рода сначала убираем -o или -e. После k/g действует написание -iem. Чередования основы возможны.","example":"student → studentem; okno → oknem","sources":["swan","polski-info"],"numbers":["sg"]},{"id":"ins-mn-iem","cases":["narzednik"],"genders":["m1","m2","m3","n"],"label":"Мужской / средний, основа на k / g → -iem","explanation":"После k или g в этой группе пишем -iem. У среднего рода убираем -o; беглая e может исчезать.","example":"park → parkiem; dziecko → dzieckiem","sources":["swan","polski-info"],"numbers":["sg"]},{"id":"loc-mn-hard","cases":["miejscownik"],"genders":["m1","m2","m3","n"],"label":"Мужской / средний, твёрдая основа → -e со смягчением","explanation":"Перед -e меняется последний согласный: p → pi, n → ni, ł → l, r → rz и другие. k/g/ch и мягкие основы рассматриваются отдельно; есть словарные исключения.","example":"sklep → sklepie; okno → oknie; rower → rowerze","sources":["swan","polski-info","wsjp-rower"],"numbers":["sg"]},{"id":"loc-mn-u","cases":["miejscownik"],"genders":["m1","m2","m3","n"],"label":"Мужской / средний, k / g / ch или мягкая основа → -u","explanation":"Для этой группы выбираем -u. У женских на -ka/-ga другое правило: -ce/-dze.","example":"park → parku; morze → morzu","sources":["swan","polski-info"],"numbers":["sg"]},{"id":"loc-exception","cases":["miejscownik"],"genders":["m1","m2","m3"],"label":"Словарное исключение местного падежа","explanation":"Некоторые частые слова требуют запоминания формы: dom → domu, syn → synu, pan → panu. Твёрдая основа здесь не даёт ожидаемое -e.","example":"dom → domu","sources":["swan","polski-info"],"numbers":["sg"]},{"id":"voc-a-o","cases":["wolacz"],"genders":["f","m1"],"label":"Обычное существительное на -a → -o","explanation":"В нейтральном звательном этой группы -a меняется на -o. Ласкательные имена с мягкой основой могут иметь -u.","example":"mama → mamo; kolega → kolego","sources":["swan","polski-info"],"numbers":["sg"]},{"id":"voc-soft-u","cases":["wolacz"],"genders":["f","m1","m2","m3"],"label":"Женские ласкательные на -sia/-cia и мужские с мягкой основой → -u","explanation":"Здесь две группы: женские ласкательные имена и слова на -sia/-cia (Zosia → Zosiu, babcia → babciu) и выбранные мужские существительные с мягкой основой (Tomasz → Tomaszu). У женских слов заменяем конечное -a на -u. Это не универсальное правило для всех женских имён.","example":"Zosia → Zosiu; babcia → babciu; Tomasz → Tomaszu","sources":["swan","polski-info"],"numbers":["sg"]},{"id":"voc-m-hard","cases":["wolacz"],"genders":["m1","m2","m3"],"label":"Мужской, регулярная твёрдая основа → -e","explanation":"Добавляем -e со смягчением или чередованием последнего согласного. Есть исключения; имена и обращения проверяются словарно.","example":"student → studencie; Piotr → Piotrze","sources":["swan","polski-info"],"numbers":["sg"]},{"id":"voc-exception","cases":["wolacz"],"genders":["m1"],"label":"Обращение-исключение: pan → panie","explanation":"Форму panie запоминаем отдельно: она отличается от местного panu.","example":"pan → panie","sources":["swan","polski-info"],"numbers":["sg"]},{"id":"pl-non-y","cases":["mianownik"],"genders":["m2","m3","f"],"numbers":["pl"],"label":"Мн. число: женский и мужской, кроме m1, твёрдая основа → -y","explanation":"У существительных женского рода и мужского рода, кроме m1 (мужских личных), во множественном числе ставится окончание -y, если основа заканчивается на твёрдую согласную, кроме k и g. После k и g пишется -i.","example":"kobieta → kobiety; kot → koty; klub → kluby; plaster → plastry","sources":["swan"],"plural_classes":["nonvirile"]},{"id":"pl-non-i","cases":["mianownik"],"genders":["m2","m3","f"],"numbers":["pl"],"label":"Мн. te: k/g или выбранные мягкие основы → -i","explanation":"После k/g вместо -y пишется -i; у женских слов типа wiadomość сохраняется мягкий согласный и добавляется -i. Беглое e (zegarek → zegarki) и другие изменения основы запоминаем со словом. Не все мягкие основы берут -i.","example":"pociąg → pociągi; wiadomość → wiadomości","sources":["swan"],"plural_classes":["nonvirile"]},{"id":"pl-non-e","cases":["mianownik"],"genders":["m2","m3","f"],"numbers":["pl"],"label":"Мн. число: мягкая/шипящая основа (кроме m1 и -ość) → -e","explanation":"У существительных женского рода и мужского рода, кроме m1 (мужских личных), во множественном числе ставится окончание -e, если основа заканчивается на мягкую или шипящую согласную, а также на c, dz, j или l. Перед -e пишем ni вместо ń и zi вместо ź. Слова на -ość в это правило не входят: wiadomość → wiadomości.","example":"koc → koce; słoń → słonie; ulica → ulice","sources":["swan"],"plural_classes":["nonvirile"]},{"id":"pl-non-a","cases":["mianownik"],"genders":["n"],"numbers":["pl"],"label":"Мн. te: средний на -o/-e → -a","explanation":"Для регулярного среднего рода снимаем -o/-e и добавляем -a. Не применяем к oko/ucho и словам на -ę; у них отдельные модели.","example":"radio → radia; zadanie → zadania","sources":["swan"],"plural_classes":["nonvirile"]},{"id":"pl-um-a","cases":["mianownik"],"genders":["n"],"numbers":["pl"],"label":"Мн. te: -um → -a","explanation":"В выбранных заимствованиях на -um это окончание заменяется на -a. Неизменяемость в единственном числе не переносится во множественное.","example":"muzeum → muzea; gimnazjum → gimnazja","sources":["swan"],"plural_classes":["nonvirile"]},{"id":"pl-non-special","cases":["mianownik"],"genders":["m2","m3","f","n"],"numbers":["pl"],"label":"Мн. te: словарная основа или особая форма","explanation":"Особую форму запоминаем целиком. Глаза и уши как части тела: oczy/uszy; другие значения oko/ucho могут давать oka/ucha. Dzieci относится к te. Род леммы сохраняется; чередования не выводятся из русского перевода.","example":"oko → oczy; dziecko → dzieci; rok → lata","sources":["swan","wsjp-imie"],"plural_classes":["nonvirile"]},{"id":"pl-only-base","cases":["mianownik"],"genders":["plural-only"],"numbers":["pl"],"label":"Только мн. число: именительный = словарная форма","explanation":"У pluralia tantum нет обычной формы единственного числа в данном значении. В именительном сохраняем словарную форму; в других падежах склоняем. В этой базе группа te.","example":"usta → usta; spodnie → spodnie","sources":["swan","wsjp-usta"],"plural_classes":["nonvirile"]},{"id":"pl-vir-i","cases":["mianownik"],"genders":["m1"],"numbers":["pl"],"label":"Мн. ci: -i со смягчением основы","explanation":"У выбранных мужских названий лиц добавляем -i с нужным чередованием: t → ci, d → dzi, s → si, z → zi, ł → l; у некоторых основ достаточно -i. У слов на -a сначала снимаем -a. Выбор -i/-owie словарный, не универсальный.","example":"student → studenci; sąsiad → sąsiedzi; turysta → turyści","sources":["swan"],"plural_classes":["virile"]},{"id":"pl-vir-y","cases":["mianownik"],"genders":["m1"],"numbers":["pl"],"label":"Мн. ci: -y после чередования / после c","explanation":"В этой группе k → c, g → dz, r → rz перед -y; у слов на -ca снимаем -a и добавляем -y. Возможны изменения основы (chłopiec → chłopcy). Выбор модели подтверждён для каждой леммы; варианты на -owie могут тоже быть нормативны.","example":"aktor → aktorzy; Polak → Polacy; kierowca → kierowcy","sources":["swan"],"plural_classes":["virile"]},{"id":"pl-vir-owie","cases":["mianownik"],"genders":["m1"],"numbers":["pl"],"label":"Мн. ci: словарное окончание -owie","explanation":"Окончание -owie выбирается словарно: не у каждого мужского названия лица. Возможны изменения основы и снятие -a/-ia: poseł → posłowie, sędzia → sędziowie. Другие нормативные варианты не считаются неправильными в заданиях.","example":"pan → panowie; uczeń → uczniowie; sędzia → sędziowie","sources":["swan","nck-sedzia"],"plural_classes":["virile"]},{"id":"pl-vir-e","cases":["mianownik"],"genders":["m1"],"numbers":["pl"],"label":"Мн. число: мужские личные, мягкая/шипящая основа → -e","explanation":"У мужских названий людей во множественном числе ставится окончание -e, если основа мягкая или шипящая: lekarz → lekarze; nauczyciel → nauczyciele. Окончание -e само по себе не означает ci: lekarze — ci, но kosze — te.","example":"lekarz → lekarze; nauczyciel → nauczyciele","sources":["swan"],"plural_classes":["virile"]},{"id":"pl-vir-anie","cases":["mianownik"],"genders":["m1"],"numbers":["pl"],"label":"Мн. ci: -anin → -anie","explanation":"У названий лиц на -anin во множественном числе исчезает -in, затем появляется -e: Amerykan-in → Amerykan-ie. Не распространять на все слова на -in: Litwin → Litwini.","example":"Amerykanin → Amerykanie; anglikanin → anglikanie","sources":["swan","cambridge-anglican"],"plural_classes":["virile"]},{"id":"pl-vir-special","cases":["mianownik"],"genders":["m1"],"numbers":["pl"],"label":"Мн. ci: особая словарная форма","explanation":"Запоминаем нетипичную форму и изменения основы целиком. Сюда входят brat → bracia, ksiądz → księża, Czech → Czesi, Włoch → Włosi, mnich → mnisi, Niemiec → Niemcy, Węgier → Węgrzy и Hiszpan → Hiszpanie. Не переносим их окончания на другие названия лиц.","example":"brat → bracia; ksiądz → księża; Hiszpan → Hiszpanie","sources":["swan"],"plural_classes":["virile"]},{"id":"pl-acc-non","cases":["biernik"],"genders":["m2","m3","f","n","plural-only"],"numbers":["pl"],"label":"Мн. te: винительный = именительный","explanation":"В немужской личной категории винительный совпадает с именительным множественного, включая животных и dzieci. Именительный и его изменения основы нужно знать; это не равенство со словарной формой единственного числа.","example":"Widzę koty, kobiety, dzieci.","sources":["swan"],"plural_classes":["nonvirile"]},{"id":"pl-acc-vir","cases":["biernik"],"genders":["m1"],"numbers":["pl"],"label":"Мн. ci: винительный = родительный","explanation":"У мужских названий лиц в нейтральной форме винительный совпадает с родительным множественного. Родительный выбирается словарно: -ów, -i/-y или особая форма; это не универсальное добавление -ów.","example":"Widzę studentów, nauczycieli, braci.","sources":["swan"],"plural_classes":["virile"]},{"id":"pl-gen-zero","cases":["dopelniacz"],"genders":["f","n","plural-only"],"numbers":["pl"],"label":"Мн.: родительный с нулевым окончанием","explanation":"В выбранных словах родительный имеет нулевое окончание; основа может изменяться (drzewo → drzew, góra → gór). Нельзя получать любую форму простым удалением последней буквы.","example":"drzewa → drzew; Mazury → Mazur","sources":["swan"],"plural_classes":["nonvirile"]},{"id":"pl-gen-ow","cases":["dopelniacz"],"genders":["m1","m2","m3","n"],"numbers":["pl"],"label":"Мн.: родительный на -ów","explanation":"Для выбранных слов используем -ów с нужной основой. У мужских мягких основ возможны -i/-y; выбор словарный. У среднего рода эта модель включает заимствования на -um.","example":"student → studentów; muzeum → muzeów","sources":["swan"],"plural_classes":["virile","nonvirile"]},{"id":"pl-gen-iy","cases":["dopelniacz"],"genders":["m1","m2","m3","f","n","plural-only"],"numbers":["pl"],"label":"Мн.: родительный на -i/-y, словарная модель","explanation":"Запоминаем родительный выбранной леммы. Мягкая основа не гарантирует -i/-y для любого слова, возможны и -ów. В wakacji окончание и написание -ji сохраняются.","example":"nauczyciel → nauczycieli; wakacje → wakacji","sources":["swan"],"plural_classes":["virile","nonvirile"]},{"id":"pl-dat-om","cases":["celownik"],"genders":["m1","m2","m3","f","n","plural-only"],"numbers":["pl"],"label":"Мн.: дательный → -om","explanation":"К основе множественного числа добавляем -om у существительных обычного склонения. Изменения основы сохраняем: dziecko → dzieciom. Субстантивированные прилагательные (księgowy) сюда не входят.","example":"student → studentom; dziecko → dzieciom","sources":["swan"],"plural_classes":["virile","nonvirile"]},{"id":"pl-ins-ami","cases":["narzednik"],"genders":["m1","m2","m3","f","n","plural-only"],"numbers":["pl"],"label":"Мн.: творительный → -ami","explanation":"Для регулярной группы добавляем -ami к основе. Не распространяем на исключения typu dzieci → dziećmi, ludzie → ludźmi или прилагательное склонение księgowy.","example":"drzewo → drzewami; student → studentami","sources":["swan"],"plural_classes":["virile","nonvirile"]},{"id":"pl-ins-special","cases":["narzednik"],"genders":["m1","m2","m3","f","n"],"numbers":["pl"],"label":"Мн.: особый творительный на -mi","explanation":"Выбранные частые существительные имеют краткое окончание и изменения основы: dzieci → dziećmi, bracia → braćmi, ludzie → ludźmi, pieniądze → pieniędzmi. Не выводится из рода автоматически.","example":"dziecko → dziećmi; brat → braćmi","sources":["swan"],"plural_classes":["virile","nonvirile"]},{"id":"pl-loc-ach","cases":["miejscownik"],"genders":["m1","m2","m3","f","n","plural-only"],"numbers":["pl"],"label":"Мн.: местный → -ach","explanation":"В выбранной регулярной группе местный множественного заканчивается на -ach. Географические исключения вроде w Niemczech изучаются отдельно; прилагательное склонение сюда не входит.","example":"wakacje → wakacjach; Alpy → Alpach","sources":["swan"],"plural_classes":["virile","nonvirile"]},{"id":"pl-voc-nom","cases":["wolacz"],"genders":["m1","m2","m3","f","n","plural-only"],"numbers":["pl"],"label":"Мн.: звательный = именительный","explanation":"При прямом обращении используем форму именительного множественного. Словарные изменения основы именительного сохраняются.","example":"Studenci, proszę o ciszę!","sources":["swan"],"plural_classes":["virile","nonvirile"]},{"id":"ins-adjectival","cases":["narzednik"],"genders":["m1","f"],"numbers":["sg"],"label":"Название профессии с прилагательным склонением","explanation":"Księgowy/księgowa — названия людей, но склоняются как прилагательные: księgowym/księgową. Не добавляем обычное существительное -em. Правило ограничено этой моделью.","example":"księgowy → księgowym; księgowa → księgową","sources":["swan","wsjp-ksiegowy"]},{"id":"ins-f-yni","cases":["narzednik"],"genders":["f"],"numbers":["sg"],"label":"Женское на -ini/-yni → -inią/-ynią","explanation":"У существительных типа bogini, gospodyni и wykładowczyni добавляем -ą к словарной форме на -i: boginią, gospodynią, wykładowczynią. Не смешиваем с мужскими словами на -i прилагательного склонения.","example":"wykładowczyni → wykładowczynią","sources":["swan","wsjp-gospodyni"]},{"id":"dat-m-special","cases":["celownik"],"genders":["m1","m2","m3"],"numbers":["sg"],"label":"Дательный: словарное -u с особой основой","explanation":"Для выбранных исключений используем -u и запоминаем основу: ojciec → ojcu, ksiądz → księdzu, książę → księciu, chłopiec → chłopcu, lew → lwu. Не все мужские слова получают -u. Другие выбранные формы на -u: chłop → chłopu, Bóg → Bogu, świat → światu. Bóg пишется с прописной буквы в монотеистическом значении.","example":"ksiądz → księdzu; książę → księciu","sources":["swan"]},{"id":"voc-f-consonant","cases":["wolacz"],"genders":["f"],"numbers":["sg"],"label":"Женский на согласный: звательный -i/-y","explanation":"Выбранные женские существительные на согласный получают -i или -y по словарной модели: miłość → miłości, noc → nocy, młodzież → młodzieży. Это не мужской звательный на -e/-u.","example":"miłość → miłości; noc → nocy","sources":["swan"]},{"id":"voc-base","cases":["wolacz"],"genders":["f","n"],"numbers":["sg"],"label":"Звательный: форма совпадает с именительным","explanation":"У среднего рода и выбранных женских слов на -i звательный совпадает со словарной формой. Это не разрешение заменять нормативный звательный любого слова именительным.","example":"dziecko → dziecko; pani → pani; gospodyni → gospodyni","sources":["swan","wsjp-gospodyni"]},{"id":"voc-m-k-special","cases":["wolacz"],"genders":["m1","m2","m3"],"numbers":["sg"],"label":"Звательный: -ku или словарное -cze","explanation":"У выбранных мужских на -k звательный -ku (mechanik → mechaniku, Tomek → Tomku). Лексические исключения: chłopiec → chłopcze, głupiec → głupcze, ojciec → ojcze. Нельзя механически обобщать -ku на все слова.","example":"mechanik → mechaniku; ojciec → ojcze","sources":["swan"]},{"id":"gen-f-ji","cases":["dopelniacz"],"genders":["f"],"numbers":["sg"],"label":"Выбранные женские на -cja → -cji","explanation":"У слов на -cja родительный имеет -cji. Не переносим это написание на каждое слово на -ia.","example":"Francja → Francji; restauracja → restauracji","sources":["swan"]},{"id":"datloc-f-ji","cases":["celownik","miejscownik"],"genders":["f"],"numbers":["sg"],"label":"Выбранные женские на -cja → -cji","explanation":"В дательном и местном у слов типа Francja и restauracja пишется -cji. Иные типы -ia проверяются отдельно.","example":"Francja → Francji; restauracja → restauracji","sources":["swan"]},{"id":"loc-m-stem","cases":["miejscownik"],"genders":["m3"],"numbers":["sg"],"label":"Местный: словарное изменение основы + -e","explanation":"В выбранных словах меняется не только конечный согласный, но и гласный основы: las → lesie. Запоминаем словарную основу, а не только окончание.","example":"las → lesie","sources":["swan"]},{"id":"gen-f-consonant","cases":["dopelniacz"],"genders":["f"],"numbers":["sg"],"label":"Женский на согласный: родительный -i/-y","explanation":"У выбранных женских существительных на согласный родительный получает -i/-y по словарной модели, с изменением написания мягкого согласного при необходимости. Нельзя применять правила мужского рода.","example":"sól → soli; pomoc → pomocy; radość → radości","sources":["swan"]}],"questions":[{"id":"kolega_1","ru":"Я встречаю **коллегу**.","pl":"Spotykam {{target}}.","lemma":"kolega","gender":"m1","preposition":"","rule":"acc-a-e","answer":"kolegę","distractors":["kolegi","koledze","kolegą"],"focus":"koleg**a**","explanation":"Spotykać требует винительного. Мужское kolega склоняется по типу на -a.","gender_note":"Kolega — мужчина: ten kolega. Окончание -a само по себе не гарантирует женский род.","number":"sg","case":"biernik","uid":"biernik/kolega_1"},{"id":"kot_1","ru":"Я вижу **кота**.","pl":"Widzę {{target}}.","lemma":"kot","gender":"m2","preposition":"","rule":"acc-m-animate","answer":"kota","distractors":["kot","kotu","kotem"],"focus":"kot","explanation":"Widzieć требует винительного. Одушевлённый мужской: форма как в родительном.","number":"sg","case":"biernik","uid":"biernik/kot_1"},{"id":"ksiazka_1","ru":"Я читаю **книгу**.","pl":"Czytam {{target}}.","lemma":"książka","gender":"f","preposition":"","rule":"acc-a-e","answer":"książkę","distractors":["książki","książce","książka"],"focus":"książk**a**","explanation":"Прямой объект при czytać: винительный без предлога. Здесь -a → -ę.","number":"sg","case":"biernik","uid":"biernik/ksiazka_1"},{"id":"noc_1","ru":"Я помню **эту ночь**.","pl":"Pamiętam tę {{target}}.","lemma":"noc","gender":"f","preposition":"","rule":"acc-f-consonant","answer":"noc","distractors":["nocy","nocą","noce"],"focus":"no**c**","explanation":"Pamiętać требует винительного. Женское noc на согласный сохраняет исходную форму.","gender_note":"Noc — женского рода: ta noc, несмотря на согласный на конце.","number":"sg","case":"biernik","uid":"biernik/noc_1"},{"id":"okno_1","ru":"Я открываю **окно**.","pl":"Otwieram {{target}}.","lemma":"okno","gender":"n","preposition":"","rule":"acc-n-base","answer":"okno","distractors":["okna","oknu","oknie"],"focus":"okn**o**","explanation":"Прямой объект; у среднего рода винительный совпадает с именительным.","number":"sg","case":"biernik","uid":"biernik/okno_1"},{"id":"pandemia_05","ru":"Во время пандемии консультации часто проходили **по телефону**.","pl":"Podczas pandemii konsultacje często odbywały się {{target}}.","lemma":"telefon","gender":"m3","preposition":"przez","rule":"acc-m-inanimate","answer":"telefon","distractors":["telefonu","telefonie","telefonem"],"focus":"telefon","explanation":"Odbywać się przez telefon: канал связи выражается przez + винительный. Telefon — мужское неодушевлённое; винительный совпадает с именительным. Русское «по» здесь не переводится как po.","number":"sg","case":"biernik","uid":"biernik/pandemia_05"},{"id":"pandemia_06","ru":"Анна хочет записаться **на приём** на пятницу.","pl":"Anna chce umówić się {{target}} na piątek.","lemma":"wizyta","gender":"f","preposition":"na","rule":"acc-a-e","answer":"wizytę","distractors":["wizyta","wizycie","wizytą"],"focus":"wizyt**a**","explanation":"Umówić się na wizytę: договориться о приёме, na + винительный. Wizyta → wizytę. Второе na в предложении относится ко времени приёма: na piątek.","number":"sg","case":"biernik","uid":"biernik/pandemia_06"},{"id":"pandemia_12","ru":"Во время пандемии наши встречи проходили **через интернет**.","pl":"Podczas pandemii nasze spotkania odbywały się {{target}}.","lemma":"internet","gender":"m3","preposition":"przez","rule":"acc-m-i u":"Завтра Пётр идёт **к стоматологу**, потому что у него болит зуб.","pl":"Jutro Piotr idzie {{target}}, ponieważ boli go ząb.","lemma":"dentysta","gender":"m1","preposition":"do","rule":"gen-m-a-y","answer":"dentysty","distractors":["dentysta","dentystę","dentyście"],"focus":"dentyst**a**","explanation":"Iść do dentysty: do + родительный. Dentysta — мужского рода, но склоняется по типу на -a: dentysta → dentysty, а не по модели lekarz → lekarza.","gender_note":"Dentysta — ten dentysta, мужской род, несмотря на окончание -a. Здесь речь о стоматологе, к которому идёт Пётр.","number":"sg","case":"dopelniacz","uid":"dopelniacz/pandemia_07a"},{"id":"pandemia_07b","ru":"Мой брат ходит **к стоматологу** два раза в год.","pl":"Mój brat chodzi {{target}} dwa razy w roku.","lemma":"dentysta","gender":"m1","preposition":"do","rule":"gen-m-a-y","answer":"dentysty","distractors":["dentystą","dentysta","dentystę"],"focus":"dentyst**a**","explanation":"Chodzić do dentysty обозначает повторяющиеся посещения. Do требует родительного: в мужском слове dentysta заменяем -a на -y.","gender_note":"Dentysta — мужской род (ten), хотя тип склонения на -a похож на женский.","number":"sg","case":"dopelniacz","uid":"dopelniacz/pandemia_07b"},{"id":"pandemia_08a","ru":"Сегодня я иду **в больницу**, чтобы навестить бабушку.","pl":"Dzisiaj idę {{target}}, żeby odwiedzić babcię.","lemma":"szpital","gender":"m3","preposition":"do","rule":"gen-m-dictionary","answer":"szpitala","distractors":["szpital","szpitalu","szpitalem"],"focus":"szpital","explanation":"Iść do szpitala: направление выражается do + родительный. У неодушевлённого szpital родительный szpitala с -a; не все неодушевлённые мужские слова имеют -u.","number":"sg","case":"dopelniacz","uid":"dopelniacz/pandemia_08a"},{"id":"pandemia_08b","ru":"Сейчас мы едем **в больницу** на обследование.","pl":"Teraz jedziemy {{target}} na badanie.","lemma":"szpital","gender":"m3","preposition":"do","rule":"gen-m-dictionary","answer":"szpitala","distractors":["szpitalowi","szpitalu","szpital"],"focus":"szpital","explanation":"Jechać do szpitala: поездка в больницу, do + родительный. Idę — иду, jadę — еду; в обоих случаях нужна словарная форма szpitala.","number":"sg","case":"dopelniacz","uid":"dopelniacz/pandemia_08b"},{"id":"pandemia_09","ru":"Моя дочь ходит **в школу** с понедельника по пятницу.","pl":"Moja córka chodzi {{target}} od poniedziałku do piątku.","lemma":"szkoła","gender":"f","preposition":"do","rule":"gen-f-y","answer":"szkoły","distractors":["szkołę","szkole","szkołą"],"focus":"szkoł**a**","explanation":"Chodzić do szkoły: посещение школы выражается do + родительный, хотя по-русски «в школу». У женского szkoła твёрдая основа: -a → -y.","number":"sg","case":"dopelniacz","uid":"dopelniacz/pandemia_09"},{"id":"pandemia_14a","ru":"Каждый вечер я выхожу **из дома** на короткую прогулку.","pl":"Każdego wieczoru wychodzę {{target}} na krótki spacer.","lemma":"dom","gender":"m3","preposition":"z","rule":"gen-m-dictionary","answer":"domu","distractors":["dom","domem","domowi"],"focus":"dom","explanation":"Wychodzić z domu: исходная точка движения, z + родительный, dom → domu. Na krótki spacer — цель выхода, na + винительный; эта часть дана целиком.","number":"sg","case":"dopelniacz","uid":"dopelniacz/pandemia_14a"},{"id":"pandemia_14b","ru":"Во время перерывов я выхожу **из дома** на короткие прогулки.","pl":"Podczas przerw wychodzę {{target}} na krótkie spacery.","lemma":"dom","gender":"m3","preposition":"z","rule":"gen-m-dictionary","answer":"domu","distractors":["domie","domem","dom"],"focus":"dom","explanation":"Исходная точка — z domu, z + родительный. Na krótkie spacery дано готовым: это винительный множественного числа с na. На пяти этапах тренируем только dom в единственном числе.","number":"sg","case":"dopelniacz","uid":"dopelniacz/pandemia_14b"},{"id":"sl_adriatyk_znad_sg","number":"sg","ru":"Я возвращаюсь **с Адриатического моря**.","pl":"Wracam {{target}}.","lemma":"Adriatyk","gender":"m3","pr "miejscownik/ksiazka_1"},{"id":"kuchnia_1","ru":"Мама готовит **на кухне**.","pl":"Mama gotuje {{target}}.","lemma":"kuchnia","gender":"f","preposition":"w","rule":"datloc-f-soft","answer":"kuchni","distractors":["kuchnię","kuchnią","kuchnia"],"focus":"kuch**ni**a","explanation":"Польское выражение w kuchni: w + местный. Мягкая основа → -i.","number":"sg","case":"miejscownik","uid":"miejscownik/kuchnia_1"},{"id":"morze_1","ru":"Мы говорим **о море**.","pl":"Rozmawiamy {{target}}.","lemma":"morze","gender":"n","preposition":"o","rule":"loc-mn-u","answer":"morzu","distractors":["morze","morza","morzem"],"focus":"mo**rz**e","explanation":"O + местный. rz относится к исторически мягким согласным; здесь -u.","number":"sg","case":"miejscownik","uid":"miejscownik/morze_1"},{"id":"pandemia_02","ru":"Сегодня я решил остаться **дома**, потому что плохо себя чувствую.","pl":"Dzisiaj postanowiłem zostać {{target}}, ponieważ źle się czuję.","lemma":"dom","gender":"m3","preposition":"w","rule":"loc-exception","answer":"domu","distractors":["domie","domem","dom"],"focus":"dom","explanation":"Zostać w domu означает «остаться дома»: место, а не направление. W требует местного падежа; dom → domu — словарное исключение.","number":"sg","case":"miejscownik","uid":"miejscownik/pandemia_02"},{"id":"pandemia_10","ru":"Когда школа была закрыта, дети учились **дома**.","pl":"Kiedy szkoła była zamknięta, dzieci uczyły się {{target}}.","lemma":"dom","gender":"m3","preposition":"w","rule":"loc-exception","answer":"domu","distractors":["dom","domie","domem"],"focus":"dom","explanation":"Uczyć się w domu: w domu указывает место учёбы, w + местный. Здесь проверяем не объект учёбы после uczyć się, а место. Dom → domu — исключение.","number":"sg","case":"miejscownik","uid":"miejscownik/pandemia_10"},{"id":"pandemia_11","ru":"С марта Анна работает удалённо **в квартире**, которую снимает вместе с сестрой.","pl":"Od marca Anna pracuje zdalnie {{target}}, które wynajmuje razem z siostrą.","lemma":"mies   const GENDER_DETAILS = { m1: 'męskoosobowy · ten student', m2: 'Неличный · męskożywotny · ten kot', m3: 'męskonieżywotny · ten stół' };
  const PLURAL_CLASSES = { virile: 'Мужской личный · ci', nonvirile: 'Немужской личный · te' };

  const genderAnswer = q => q.number === 'pl' ? q.plural_class : q.gender;
  const genderLabel = q => q.number === 'pl' ? PLURAL_CLASSES[q.plural_class] : [q.gender, ...(q.gender_alternatives || [])].map(g => GENDERS[g]).join(' / ');
  const DAY = 86400000;
  const blank = () => ({ version: 1, questions: {}, history: [], session: null, filter: 'all', numberFilter: 'all', mode: 'all', completedPool: { all: [], review: [] } });
  const count = v => Number.isSafeInteger(v) && v >= 0 && v < 1e9 ? v : 0;
  const time = v => Number.isFinite(v) && v >= 0 && v < 9e15 ? v : 0;
  const record = () => ({ completed: 0, clean: 0, streak: 0, due: 0, last: 0, stages: Object.fromEntries(STAGES.map(s => [s, { attempts: 0, errors: 0, hints: 0 }])) });
  function random(seed) {
    let hash = 2166136261;
    for (const c of String(seed)) hash = Math.imul(hash ^ c.charCodeAt(0), 16777619);
    return () => { hash += 0x6D2B79F5; let t = hash; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }
  function shuffle(items, seed) {
    const a = [...items], rng = random(seed);
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }

  }

  function ruleCandidates(q, db, seed, selectedGender = genderAnswer(q)) {

    // conservative protection for dictionary-dependent personal nominatives.
    const equivalents = new Set(db.questions.filter(other => other.lemma === q.lemma && other.case === q.case && (other.number ?? 'sg') === number).map(other => other.rule));
    const candidates = db.rules.filter(r => r.id !== q.rule && !equivalents.has(r.id) && r.cases.includes(q.case) && !(number === 'pl' && q.plural_class === 'virile' && q.case === 'mianownik' && r.numbers.includes('pl') && r.plural_classes?.includes('virile')));

      const sameNumber = r.numbers.includes(number);

      if (sameNumber && sameGender) return 0;

      if (sameNumber) return 2;
      if (sameGender) return 3;

    return shuffle(candidates, seed).sort((a,b) => rank(a) - rank(b));

    const answer = correct(q, stage);

    box.append(path,node('p','',q.explanation),button('Следующее упражнение →','primary',()=>nextQuestion(q.uid)));return box;
  }
  function practice() {
    intro('Не угадывай. Понимай.','Польские падежи — по одному решению за раз. От смысла предложения до правильного окончания.');
    if(!state.session){const q=E.choose(state,db);if(q){E.start(state,q);save();}}
    const workspace=node('div','workspace'),col=node('div','exercise-column'); col.append(toolbar());
    const q=current();
    if(q) col.append(exercise(q));
    else {
      const empty=node('section','exercise empty');
      empty.append(node('h2','','Пока нечего повторять'),node('p','','Здесь появятся завершённые упражнения с ошибками и карточки, для которых наступил срок повторения.'),button('К обычной практике','primary',()=>{state.mode='all';nextQuestion();}));col.append(empty);
    }
    workspace.append(col,sidebar(q));main.append(workspace);
  }
  function rules() {
    intro('У каждого окончания — причина.','Общий справочник правил: найди тип слова, посмотри на основу, вспомни исключения.','ОПОРА ДЛЯ ПРАКТИКИ');
    const top=node('div','reference-top');top.append(selectNumber(ruleNumber,value=>{ruleNumber=value;render();},'rule-number-filter'),selectCase(ruleFilter,value=>{ruleFilter=value;render();},'rule-filter'),button('← Вернуться к упражнению','secondary',()=>changeView('practice')));main.append(top,node('p','scope-note',db.scope));
    if(state.session?.helped&&state.session.stage<5)main.append(node('p','scope-note','Для текущей карточки отмечена помощь: результат не будет считаться полностью самостоятельным.'));
    const genderGuide=node('section','gender-guide');
    genderGuide.append(node('h2','','Три типа мужского рода'));
    const genderList=node('ul');
    for(const text of [
      'm1 · Мужской личный (męskoosobowy): ten student → ci studenci. Винительный: widzę studenta → widzę studentów.',
      'm2 · Мужской одушевлённый неличный (męskożywotny): ten kot → te koty. Винительный: widzę kota → widzę koty.',
      'm3 · Мужской неодушевлённый (męskonieżywotny): ten stół → te stoły. Винительный: widzę stół → widzę stoły.'
    ]) genderList.append(node('li','',text));
    genderGuide.append(genderList,node('p','','Примеры винительного здесь — для слов на согласный. Мужские на -a склоняются иначе: kolega → kolegę, оставаясь m1. Грамматический тип не всегда следует из значения: banan (плод) — m2. Для wirus и koronawirus словарь допускает m2 и m3; тренажёр принимает оба ответа. Женский и средний род остаются отдельными; во множественном выбираем ci / te.'));
    main.append(genderGuide);
    const grid=node('div','reference-grid');
    for(const r of db.rules.filter(r=>(ruleFilter==='all'||r.cases.includes(ruleFilter))&&(ruleNumber==='all'||r.numbers.includes(ruleNumber)))) {
      const card=node('article','rule-card'),chips=node('div','case-chips');
      chips.append(node('span','case-chip',r.numbers.includes('pl')?'Множественное число':'Единственное число'));
      for(const id of r.cases)chips.append(node('span','case-chip',db.cases.find(c=>c.id===id).name));
      card.append(chips,node('h3','',r.label),node('p','',r.explanation),node('div','rule-example',r.example));grid.append(card);
    }
    main.append(grid);
    const sources=node('section','sources');sources.append(node('strong','','Источники и границы справочника'),node('p','','Правила сформулированы для стартовой базы. Словарные исключения и неоднозначные окончания изучаются отдельно. Ссылки требуют интернета; сама тренировка работает офлайн.'));
    for(const s of db.sources){const a=node('a','',s.title+' ↗');a.href=s.url;a.target='_blank';a.rel='noopener noreferrer';sources.append(a);}main.append(sources);
  }
  function dictionary() {
    intro('Слова превращаются в практику.','Словарь разделов 2.15–2.24: формы, переводы и упражнения. Глаголы и служебные слова помогают понять контекст.','СЛОВАРЬ');
    const label=node('label','dictionary-search','Найти слово или перевод'); label.htmlFor='dictionary-search';
    const input=node('input'); input.id='dictionary-search'; input.type='search'; input.value=dictionaryQuery; input.placeholder='Например: dzieci, руки, 2.23'; label.append(input); main.append(label);
    const count=node('p','scope-note'); count.setAttribute('role','status'); const list=node('div','reference-grid');
    let visible=60; const more=button('Показать ещё','secondary dictionary-more',()=>{visible+=60;results();}); main.append(count,list,more);
    const normalize=s=>s.toLocaleLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ł/g,'l');
    const kinds={noun:'Существительное',phrase:'Готовая цепочка',verb:'Глагол · контекст',adjective:'Прилагательное · контекст',preposition:'Предлог · контекст'};
    function results() {
      const query=normalize(dictionaryQuery.trim());
      const entries=db.lexicon.filter(e=>normalize(e.text+' '+e.section+' '+(e.note||'')).includes(query));
      count.textContent=`Найдено записей: ${entries.length}. Показано: ${Math.min(entries.length,visible)}.`; more.hidden=entries.length<=visible; list.replaceChildren();
      for(const e of entries.slice(0,visible)) {
        const card=node('article','rule-card dictionary-card'); card.append(node('span','case-chip',e.section+' · '+kinds[e.kind]),node('p','dictionary-entry',e.text));
        if(e.note)card.append(node('p','',e.note));
        if(e.targets.length) {
          const choices=node('div','dictionary-actions');
          for(const uid of e.targets) {
            const q=db.questions.find(q=>q.uid===uid);
            choices.append(button(`${caseOf(q).name} · ${q.number==='pl'?'мн.':'ед.'} →`, 'secondary',()=>{state.filter=q.case;state.numberFilter=q.number;state.mode='all';E.start(state,q);view='practice';save();render();focusHeading();}));
          }
          card.append(choices);
        }
        list.append(card);
      }
    }
    input.addEventListener('input',()=>{dictionaryQuery=input.value;visible=60;results();}); results();
  }
  function stats() {
    intro('Видно, что стоит повторить.','Здесь сохраняется не только результат, но и шаг, на котором понадобилась ещё одна попытка.','ТВОЯ ПРАКТИКА');
    const t=E.totals(state), grid=node('div','stats-grid');
    const accuracy=t.attempts?Math.round((t.attempts-t.errors)/t.attempts*100)+'%':'—';
    const review=db.questions.filter(q=>E.needsReview(state.questions[q.uid],Date.now()));
    for(const [value,label]of[[t.completed,'Упражнений завершено'],[accuracy,'Правильных попыток'],[t.clean,'Пройдено без ошибок и помощи'],[review.length,'Упражнений к повторению']]){const c=node('div','stat-card');c.append(node('span','stat-value',String(value)),node('span','stat-label',label));grid.append(c);}main.append(grid);
    const panel=node('section','stats-panel');panel.append(node('h2','','На каком шаге сложнее?'),node('p','','Полоса показывает долю ошибочных попыток. Подсказки учитываются отдельно; повторные клики по уже отвергнутому ответу не считаются.'));
    E.STAGES.forEach((s,i)=>{const r=t.stages[s],row=node('div','stage-stat'),bar=node('div','bar'),fill=node('div','bar-fill');fill.style.width=(r.attempts?r.errors/r.attempts*100:0)+'%';bar.append(fill);row.append(node('span','',E.STAGE_NAMES[i]),bar,node('span','stage-count',`${r.errors} / ${r.attempts} ошибок · ${r.hints} подсказок`));panel.append(row);});main.append(panel);
    const repeats=node('section','stats-panel');repeats.append(node('h2','','Вернуться к сложному'),node('p','',review.length?'Случайный порядок без повторов до конца доступного набора. После ошибок повтор доступен сразу в этом режиме.':'Реши первые упражнения. Здесь появятся карточки с ошибками, помощью или наступившим сроком.'));
    if(review.length){repeats.append(button('Начать повторение →','primary',()=>{state.mode='review';state.filter='all';state.numberFilter='all';view='practice';nextQuestion();}));const list=node('ul','review-list');for(const q of review.slice(0,8)){const li=node('li'),text=node('div');text.append(rich(q.ru),node('small','',caseOf(q).name+' · '+q.lemma));li.append(text,button('Повторить','secondary',()=>{E.start(state,q);view='practice';save();render();focusHeading();}));list.append(li);}repeats.append(list);}main.append(repeats);
    const storage=node('section','stats-panel');storage.append(node('h2','','Только в твоём браузере'),node('p','',`Прогресс хранится локально и никуда не отправляется. База: ${db.questions.length} упражнений и ${db.rules.length} правил. При переносе HTML на другой путь или в другой браузер сохранённый прогресс может быть недоступен. Очистка данных браузера удалит его.`));
    const reset=button('Сбросить прогресс','text-btn danger',()=>{reset.hidden=true;const confirm=node('div','confirm-reset');confirm.append(node('span','','Удалить все локальные ответы и текущую карточку?'),button('Да, удалить','secondary danger',()=>{state=E.blank();save();render();}),button('Отмена','secondary',()=>{confirm.remove();reset.hidden=false;reset.focus();}));storage.append(confirm);confirm.querySelector('button').focus();});storage.append(reset);main.append(storage);
  }
  function render() {
    main.replaceChildren();
    document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);if(b.dataset.view===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
    ({practice,rules,stats,dictionary})[view]();
    $('#storage-warning').hidden=storageOK;
  }
  document.addEventListener('keydown',e=>{
    if(e.altKey||e.ctrlKey||e.metaKey||e.repeat||['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;
    if(view==='practice'&&/^[1-7]$/.test(e.key)){const b=main.querySelectorAll('.choice')[Number(e.key)-1];if(b&&!b.disabled){e.preventDefault();b.click();}}
  });
  render();
})();
</script>
</body>
</html>
